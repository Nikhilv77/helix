[project]
name = "trailgrad-agent"
version = "0.1.0"
description = "Trailgrad voice interviewer. Speech in, speech out; the interview brain lives in the Next.js app."
requires-python = ">=3.11"

dependencies = [
    "livekit-agents[deepgram,silero]~=1.6",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
]

# This is a service, not a library — there is nothing to package. Without this
# setuptools refuses to build, seeing config/trailgrad/main as a flat layout.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
